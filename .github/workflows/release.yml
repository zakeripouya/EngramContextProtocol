name: Release

# Push a tag like v0.11.0 to build binaries for every platform and publish a
# GitHub release with checksums. SQLite needs cgo, so each target builds natively.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-14, goos: darwin, goarch: arm64 }
          - { os: macos-13, goos: darwin, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          ext=""; [[ "${{ matrix.goos }}" == windows ]] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/zakeripouya/EngramContextProtocol/internal/server.Version=${version}" \
            -o "dist/engram${ext}" ./cmd/engram
          ./dist/engram${ext} version
          name="engram_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp LICENSE README.md dist/
          if [[ "${{ matrix.goos }}" == windows ]]; then
            (cd dist && 7z a "../${name}.zip" engram.exe LICENSE README.md >/dev/null)
          else
            tar -C dist -czf "${name}.tar.gz" engram LICENSE README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: engram_*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum engram_* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" engram_* checksums.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ghcr.io image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker build --build-arg VERSION="$version" -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
