name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema copy is in sync
        run: diff spec/schema.ts sdk/typescript/src/schema.ts
      - name: TypeScript and Python SDKs against a live server
        run: sdk/test.sh

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Engram passes the ECP conformance suite over stdio
        run: |
          go build -o engram ./cmd/engram
          export ENGRAM_DB="$RUNNER_TEMP/engram.db" ENGRAM_EMBED=hash ENGRAM_LLM=off
          ./engram pair conformance --read conformance/test --write conformance/test
          ./engram conformance -- ./engram serve --client conformance

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start it
        run: |
          docker build --build-arg VERSION=ci -t engram:ci .
          docker run --rm engram:ci version
          docker compose config >/dev/null
