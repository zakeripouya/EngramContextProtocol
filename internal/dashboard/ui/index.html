<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engram Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='10' r='4' fill='%236d5dfc'/%3E%3Ccircle cx='23' cy='9' r='3' fill='%236d5dfc'/%3E%3Ccircle cx='16' cy='23' r='5' fill='%236d5dfc'/%3E%3Cpath d='M9 10L23 9L16 23Z' stroke='%236d5dfc' fill='none' stroke-width='1.5'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Engram</div>
  <nav id="nav" aria-label="Views"></nav>
  <div class="status" id="status" role="status"></div>
</header>
<main id="view" tabindex="-1"></main>
<aside id="drawer" class="drawer" aria-hidden="true">
  <button class="close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>
<script src="app.js"></script>
</body>
</html>
